# Local development helpers. In production Mongo and MinIO already run on the server (see docs/DEVELOPMENT_GUIDE.md).
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  minio:            # optional: only needed with FARMIVO_PHOTO_STORE=minio
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
volumes:
  mongo-data:
  minio-data:
