# Optional reverse proxy in front of gunicorn (TLS is required for the mobile apps in production).
server {
    listen 80;
    server_name api.example.com;      # <- your domain; add TLS with certbot

    client_max_body_size 6m;          # photos are limited to 5 MB

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
