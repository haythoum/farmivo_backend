; Supervisor program for the Farmivo API (Flask + gunicorn).
; Install:  sudo cp deploy/supervisor/farmivo.conf /etc/supervisor/conf.d/farmivo.conf
;           sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status farmivo
; Assumes the code lives in /srv/farmivo, a virtualenv in /srv/farmivo/.venv and the settings
; in /srv/farmivo/.env (see .env.example). Adjust the paths and the user to your server.

[program:farmivo]
directory=/srv/farmivo
command=/srv/farmivo/.venv/bin/gunicorn --workers 2 --bind 127.0.0.1:8000 --timeout 60 --access-logfile - app.main:app
user=www-data
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
; Environment: gunicorn's app reads /srv/farmivo/.env itself (pydantic-settings).
; GOOGLE_APPLICATION_CREDENTIALS must be an absolute path (Firebase Admin does not read .env).
environment=PYTHONUNBUFFERED="1",GOOGLE_APPLICATION_CREDENTIALS="/srv/farmivo/serviceAccountKey.json"
stdout_logfile=/var/log/farmivo/farmivo.out.log
stderr_logfile=/var/log/farmivo/farmivo.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
